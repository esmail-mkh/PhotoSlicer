name: Build & Release PhotoSlicer

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create Draft Release on GitHub'
        type: boolean
        required: true
        default: true
      version_tag:
        description: 'Release Tag Version (e.g. v5.1.2)'
        type: string
        required: false
        default: 'v5.1.2'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            asset_suffix: Windows
          - os: ubuntu-latest
            target_os: linux
            asset_suffix: Linux
          - os: macos-latest
            target_os: macos
            asset_suffix: macOS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.0 || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Setup UPX (Windows)
        if: matrix.target_os == 'windows'
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller (Windows)
        if: matrix.target_os == 'windows'
        shell: powershell
        run: |
          $tag = "${{ inputs.version_tag }}"
          if (-not $tag) { $tag = "v5.1.2" }
          $exeName = "PhotoSlicer $tag"
          pyinstaller --noconfirm --onefile --windowed --icon "assets/icon.ico" --name "$exeName" --clean --splash "splash.png" --add-data "assets;assets/" --add-data "engine.py;." main.py

      - name: Build Executable with PyInstaller (Linux & macOS)
        if: matrix.target_os != 'windows'
        run: |
          TAG="${{ inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="v5.1.2"; fi
          EXE_NAME="PhotoSlicer-$TAG"
          pyinstaller --noconfirm --onefile --windowed --icon "assets/icon.ico" --name "$EXE_NAME" --clean --add-data "assets:assets" --add-data "engine.py:." main.py

      - name: Package Windows Artifact
        if: matrix.target_os == 'windows'
        shell: powershell
        run: |
          $tag = "${{ inputs.version_tag }}"
          if (-not $tag) { $tag = "v5.1.2" }
          $zipName = "PhotoSlicer-$tag-Windows.zip"
          New-Item -ItemType Directory -Path "dist_pkg" -Force
          Copy-Item -Path "dist\*.exe" -Destination "dist_pkg\"
          Copy-Item -Path "up-model" -Destination "dist_pkg\up-model" -Recurse -Force
          Remove-Item -Path "dist_pkg\up-model\realesrgan-ncnn-vulkan-ubuntu" -ErrorAction SilentlyContinue
          Remove-Item -Path "dist_pkg\up-model\realesrgan-ncnn-vulkan-macos" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist_pkg\*" -DestinationPath $zipName -Force

      - name: Package Linux Artifact
        if: matrix.target_os == 'linux'
        run: |
          TAG="${{ inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="v5.1.2"; fi
          ZIP_NAME="PhotoSlicer-$TAG-Linux.zip"
          mkdir -p dist_pkg
          cp -r dist/* dist_pkg/
          cp -r up-model dist_pkg/
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan.exe
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan-macos
          chmod +x dist_pkg/PhotoSlicer* || true
          chmod +x dist_pkg/up-model/realesrgan-ncnn-vulkan-ubuntu || true
          cd dist_pkg && zip -r "../$ZIP_NAME" . && cd ..

      - name: Package macOS Artifact
        if: matrix.target_os == 'macos'
        run: |
          TAG="${{ inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="v5.1.2"; fi
          ZIP_NAME="PhotoSlicer-$TAG-macOS.zip"
          mkdir -p dist_pkg
          cp -r dist/* dist_pkg/
          cp -r up-model dist_pkg/
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan.exe
          rm -f dist_pkg/up-model/realesrgan-ncnn-vulkan-ubuntu
          chmod -R +x dist_pkg/ || true
          cd dist_pkg && zip -r "../$ZIP_NAME" . && cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSlicer-${{ matrix.asset_suffix }}
          path: PhotoSlicer-*.zip

  release:
    name: Create Draft Release
    if: ${{ inputs.create_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare Release Variables
        run: |
          TAG="${{ inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="v5.1.2"; fi
          CLEAN_VER="${TAG#v}"
          CLEAN_VER="${CLEAN_VER#V}"
          echo "CLEAN_VERSION=$CLEAN_VER" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Version $CLEAN_VER" >> $GITHUB_ENV

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.version_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          files: release_assets/**/*.zip
          body: |
            [🇮🇷 **فارسی**](#-فوتو-اسلایسر-نسخه-${{ env.CLEAN_VERSION }}) | [🇬🇧 **English**](#-photoslicer-v${{ env.CLEAN_VERSION }})

            ---

            <div dir="rtl">

            # 🚀 فوتو اسلایسر نسخه ${{ env.CLEAN_VERSION }}

            **نسخه ${{ env.CLEAN_VERSION }} منتشر شد!** پکیج‌های بیلد اختصاصی سیستم‌عامل‌های **Windows**, **Linux** و **macOS** آماده دانلود هستند.

            ### 🌟 تغییرات جدید (نسخه ${{ env.CLEAN_VERSION }})

            * **✨ ویژگی جدید:** پشتیبانی همزمان از بسته‌های سیستم‌عامل‌های Windows, Linux و macOS.

            ---

            ### 📥 دانلود و نصب

            فایل **ZIP** مربوط به سیستم‌عامل خود را از لیست فایل‌های پیوست این Release دانلود و اکسترکت کنید:
            * **[Windows]** `PhotoSlicer-v${{ env.CLEAN_VERSION }}-Windows.zip`
            * **[Linux]** `PhotoSlicer-v${{ env.CLEAN_VERSION }}-Linux.zip`
            * **[macOS]** `PhotoSlicer-v${{ env.CLEAN_VERSION }}-macOS.zip`

            </div>

            ---

            # 🚀 PhotoSlicer v${{ env.CLEAN_VERSION }}

            **Version ${{ env.CLEAN_VERSION }} is here!** Native builds for **Windows**, **Linux**, and **macOS** are ready.

            ### 🌟 What's New (v${{ env.CLEAN_VERSION }})

            * **✨ Feature:** Multi-platform native builds for Windows, Linux, and macOS.

            ---

            ### 📥 Installation

            Download the appropriate **ZIP** archive for your operating system:
            * **[Windows]** `PhotoSlicer-v${{ env.CLEAN_VERSION }}-Windows.zip`
            * **[Linux]** `PhotoSlicer-v${{ env.CLEAN_VERSION }}-Linux.zip`
            * **[macOS]** `PhotoSlicer-v${{ env.CLEAN_VERSION }}-macOS.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
